<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journaling — Senara</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,300..800;1,6..12,300..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/journaling.css">
</head>

<body>
  <aside id="sidebar" class="sidebar"></aside>

  <div class="app-shell">
    <header class="app-header"></header>

    <main class="app-main">
      <div class="container journal">
        <div class="journal__inner">
          <div class="journal__head">
            <h1 class="text-headline-lg journal__title" id="page-heading">Journaling Hari Ini</h1>

            <div class="segmented" role="group" aria-label="Mode jurnal">
              <button class="segmented__btn is-active" type="button" id="btn-mode-new" aria-pressed="true">
                Mode: Tulis Baru
              </button>
              <button class="segmented__btn" type="button" id="btn-mode-edit" aria-pressed="false">
                Mode: Edit Jurnal
              </button>
            </div>
          </div>

          <section class="card card--glass journal__card" aria-labelledby="page-heading">
            <!-- Banner mode edit -->
            <div class="alert alert--info journal__notice hidden" id="edit-notice">
              <span class="alert__icon"><span class="icon icon--md" aria-hidden="true">info</span></span>
              <div class="alert__body">
                <span class="alert__title">Tanggal ini sudah punya jurnal</span>
                <p class="alert__text journal__notice-text" id="edit-notice-text"></p>
              </div>
              <span class="chip chip--sm journal__notice-chip">Tersimpan</span>
            </div>

            <form class="form" id="journal-form" novalidate>
              <!-- Tanggal -->
              <div class="field">
                <label class="field__label field__label--strong" for="journal-date-display">
                  <span class="icon icon--md text-primary" aria-hidden="true">calendar_today</span>
                  <span>Waktu &amp; Tanggal Kejadian</span>
                </label>
                <div class="journal__date-row">
                  <div class="journal__date-input">
                    <input class="input journal__date-display" id="journal-date-display" type="text" readonly>
                    <input class="journal__date-native" id="journal-date" type="date" tabindex="-1" aria-hidden="true">
                    <span class="icon journal__date-icon" aria-hidden="true">event</span>
                  </div>
                  <div class="journal__date-quick">
                    <button class="btn btn--tonal btn--md journal__quick" type="button" data-quick-date="0">Hari Ini</button>
                    <button class="btn btn--tonal btn--md journal__quick" type="button" data-quick-date="1">Kemarin</button>
                  </div>
                </div>
              </div>

              <!-- Foto -->
              <div class="field">
                <div class="field__row">
                  <span class="field__label field__label--strong">
                    <span class="icon icon--md text-primary" aria-hidden="true">photo_camera</span>
                    <span>Upload Momen Kamu</span>
                  </span>
                  <span class="text-label-sm text-muted">Maksimum 10 MB</span>
                </div>

                <label class="dropzone" id="photo-empty">
                  <span class="icon-circle icon-circle--peach dropzone__icon">
                    <span class="icon icon--lg" aria-hidden="true">add_a_photo</span>
                  </span>
                  <span class="dropzone__text">
                    <span class="text-label-md dropzone__title">Tarik &amp; lepas foto di sini, atau telusuri berkas</span>
                    <span class="text-body-sm text-muted">Format JPG, PNG, atau WebP didukung</span>
                  </span>
                  <input class="dropzone__input" id="photo-input" type="file" accept="image/*">
                </label>

                <div class="photo-preview hidden" id="photo-preview">
                  <div class="photo-preview__thumb">
                    <img id="photo-preview-img" alt="Pratinjau foto momen">
                  </div>
                  <div class="photo-preview__info">
                    <div class="photo-preview__name">
                      <span class="icon icon--md text-primary" aria-hidden="true">verified</span>
                      <span class="text-label-md truncate" id="photo-preview-name"></span>
                    </div>
                    <div class="photo-preview__actions">
                      <button class="btn btn--tonal btn--sm" type="button" id="btn-photo-replace">
                        <span class="icon icon--xs" aria-hidden="true">sync</span>
                        <span>Ganti Foto</span>
                      </button>
                      <button class="btn btn--sm photo-preview__remove" type="button" id="btn-photo-remove">
                        <span class="icon icon--xs" aria-hidden="true">delete</span>
                        <span>Hapus</span>
                      </button>
                    </div>
                  </div>
                </div>
                <p class="field__error hidden" id="photo-error">
                  <span class="icon icon--sm" aria-hidden="true">error</span>
                  <span id="photo-error-text"></span>
                </p>
              </div>

              <!-- Catatan -->
              <div class="field">
                <div class="field__row">
                  <label class="field__label field__label--strong" for="journal-note">
                    <span class="icon icon--md text-primary" aria-hidden="true">draw</span>
                    <span>Catatan</span>
                  </label>
                  <span class="text-label-sm text-muted" id="note-counter">0 kata • 0 karakter</span>
                </div>
                <textarea class="textarea" id="journal-note" rows="6"
                  placeholder="Ceritakan tentang harimu, apa pun yang ingin kamu bagikan."></textarea>
                <p class="field__error hidden" id="note-error">
                  <span class="icon icon--sm" aria-hidden="true">error</span>
                  Tulis sedikit catatan atau unggah foto terlebih dahulu.
                </p>
              </div>

              <div class="journal__actions">
                <button class="btn btn--danger-ghost btn--md journal__delete hidden" type="button" id="btn-delete">
                  Hapus Catatan Ini
                </button>
                <button class="btn btn--tonal btn--md btn--wide journal__cancel" type="button" id="btn-cancel">
                  Batal
                </button>
                <button class="btn btn--primary btn--md btn--wide journal__submit" type="submit" id="btn-submit">
                  <span class="icon icon--md" aria-hidden="true">check_circle</span>
                  <span id="btn-submit-text">Simpan</span>
                </button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <nav id="bottom-nav" class="bottom-nav"></nav>

  <script type="module" src="js/pages/journaling.js"></script>
</body>

</html>
