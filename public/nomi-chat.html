<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nomi — Senara</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Nunito+Sans:ital,opsz,wght@0,6..12,300..800;1,6..12,300..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/nomi-chat.css">
</head>

<body>
  <aside id="sidebar" class="sidebar"></aside>

  <div class="app-shell">
    <header class="app-header"></header>

    <main class="app-main chat-main">
      <div class="chat">
        <!-- Header Nomi -->
        <section class="chat__header">
          <div class="chat__identity">
            <div class="chat__avatar-wrap">
              <span class="avatar avatar--nomi chat__avatar">
                <img src="assets/images/nomi.jpg" alt="Nomi">
              </span>
              <span class="chat__online" title="Online"></span>
            </div>
            <div class="chat__identity-text">
              <span class="text-headline-sm chat__name">Nomi</span>
              <p class="text-body-sm text-muted truncate">Teman untukmu bercerita</p>
            </div>
          </div>

          <div class="chat__options">
            <button class="icon-btn chat__options-btn" type="button" id="options-trigger"
              aria-haspopup="true" aria-expanded="false" aria-controls="options-menu" title="Opsi Chat">
              <span class="icon" aria-hidden="true">more_vert</span>
            </button>
            <div class="menu hidden" id="options-menu" role="menu">
              <button class="menu__item menu__item--danger" type="button" role="menuitem" id="btn-clear">
                <span class="icon icon--md" aria-hidden="true">delete_sweep</span>
                Bersihkan riwayat chat
              </button>
              <button class="menu__item" type="button" role="menuitem" id="btn-calm">
                <span class="icon icon--md" aria-hidden="true">spa</span>
                Mode Tenang
              </button>
            </div>
          </div>
        </section>

        <!-- Aliran pesan -->
        <div class="chat__stream" id="chat-stream" aria-live="polite"></div>

        <!-- Input -->
        <footer class="chat__composer">
          <form class="chat__form" id="chat-form">
            <input class="chat__input" id="chat-input" type="text" autocomplete="off"
              placeholder="Ngobrol apapun..." aria-label="Tulis pesan untuk Nomi">
            <button class="chat__send" type="submit" id="send-btn" title="Kirim pesan" aria-label="Kirim pesan">
              <span class="icon" aria-hidden="true">send</span>
            </button>
          </form>
          <p class="chat__privacy text-label-sm">
            <span class="icon icon--xs" aria-hidden="true">lock</span>
            <span>Percakapanmu bersifat pribadi &amp; terenkripsi. Ceritakan apapun dengan aman.</span>
          </p>
        </footer>
      </div>
    </main>
  </div>

  <nav id="bottom-nav" class="bottom-nav"></nav>

  <!-- Modal latihan napas -->
  <div class="modal hidden" id="breathe-modal" role="dialog" aria-modal="true" aria-labelledby="breathe-instruction">
    <div class="modal__dialog breathe">
      <div class="breathe__circle" id="breathe-circle" data-phase="exhale">
        <span class="breathe__core">
          <span class="icon" aria-hidden="true">air</span>
        </span>
      </div>
      <div>
        <h3 class="modal__title" id="breathe-instruction">Hembuskan Perlahan...</h3>
        <p class="text-body-sm text-muted breathe__hint">Rasakan ketenangan mengalir di dalam tubuhmu</p>
      </div>
      <button class="btn breathe__done" type="button" data-modal-close>Selesai</button>
    </div>
  </div>

  <script type="module" src="js/pages/nomi-chat.js"></script>
</body>

</html>
